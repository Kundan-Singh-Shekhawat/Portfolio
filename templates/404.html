{% extends "base.html" %}

{% block content %}
<section class="bg-ivory py-16 sm:py-24">
  <div class="max-w-6xl mx-auto px-5 sm:px-8 lg:px-12">
    <div class="bg-band p-8 sm:p-14 border border-ink/10 space-y-6">
      <p class="text-xs uppercase tracking-[0.22em] font-semibold text-emerald-accent">
        STATUS 404 // NOT FOUND
      </p>
      <h1 class="font-display-condensed text-6xl sm:text-8xl font-bold text-ink uppercase">
        404 — Page Not Found
      </h1>
      <span class="emerald-bar-wide"></span>
      <p class="text-base sm:text-lg text-ink/80 max-w-lg">
        The page or project you requested could not be found. Return to the home page or browse all projects below.
      </p>
      <div class="pt-2 flex flex-wrap gap-4">
        <a
          href="/"
          class="arrow-link inline-flex items-center gap-2 px-6 py-3 bg-ink text-ivory text-xs uppercase tracking-[0.16em] font-medium hover:bg-emerald-accent hover:text-white transition-colors"
        >
          <span>Return Home</span>
          <span class="arrow-icon">→</span>
        </a>
        <a
          href="/projects"
          class="arrow-link inline-flex items-center gap-2 px-6 py-3 border border-emerald-accent text-ink text-xs uppercase tracking-[0.16em] font-medium hover:bg-emerald-accent hover:text-white transition-colors"
        >
          <span>View Projects</span>
          <span class="arrow-icon">→</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
